name: audistine daily quote push

on:
  schedule:
    # Check devices every five minutes; each device's stored local schedule fires only once per day.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only verify configuration; do not send'
        type: boolean
        required: true
        default: true
      send_test:
        description: 'Send an immediate test to exactly one registered device'
        type: boolean
        required: true
        default: false
      test_device_id:
        description: 'Exact device ID under pushSubscriptions/{uid}/{deviceId}; required for send_test'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: audistine-daily-push
  cancel-in-progress: false

jobs:
  send-daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sender dependency
        run: npm install --prefix scripts --omit=dev --no-audit --no-fund --no-package-lock

      - name: Decode Firebase credential file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/audistine-firebase-service-account.json"
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_B64" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is empty. Store the base64-encoded service-account JSON in that secret." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > "$credential_file"
          chmod 600 "$credential_file"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$credential_file"
          printf 'FIREBASE_SERVICE_ACCOUNT_FILE=%s\n' "$credential_file" >> "$GITHUB_ENV"

      - name: Send due daily quotes or a targeted test
        run: node scripts/send-daily-push.js
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test || false }}
          TEST_DEVICE_ID: ${{ inputs.test_device_id || '' }}

      - name: Remove Firebase credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/audistine-firebase-service-account.json"
